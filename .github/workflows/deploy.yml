name: Deploy Swarna India to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Dependencies & Build React App
        run: |
          cd Front
          npm ci
          npm run build

      - name: 🚀 Deploy Frontend (React Build) to cPanel via FTP
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./Front/dist/
          server-dir: ${{ secrets.FTP_FRONTEND_DIR || '/public_html/' }}
          state-name: .ftp-deploy-sync-frontend.json

      - name: 🚀 Deploy Backend (Node.js API) to cPanel via FTP
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./Back/
          server-dir: ${{ secrets.FTP_BACKEND_DIR || '/backend/' }}
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.env
          state-name: .ftp-deploy-sync-backend.json
