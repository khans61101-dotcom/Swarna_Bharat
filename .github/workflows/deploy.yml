name: Deploy Swarna India to cPanel (Automated CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Dependencies & Build React App
        run: |
          cd Front
          npm install --legacy-peer-deps
          npm run build

      - name: 🛠️ Install LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🚀 Deploy Frontend (React Build) to swarna.hopeharbor.co.in
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:connection-limit 1;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror --reverse --verbose --exclude .htaccess ./Front/dist/ ./swarna.hopeharbor.co.in/;
          "

      - name: 🚀 Deploy Backend (Node.js API) to swarnaback.hopeharbor.co.in
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set ftp:passive-mode true;
            set net:connection-limit 1;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror --reverse --verbose --exclude node_modules/ --exclude .git/ --exclude .env --exclude tmp/ ./Back/ ./swarnaback.hopeharbor.co.in/;
            mkdir -p ./swarnaback.hopeharbor.co.in/tmp;
            put /dev/null -o ./swarnaback.hopeharbor.co.in/tmp/restart.txt;
          "
