name: Deploy Swarna India to cPanel (Automated CI/CD)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Frontend Dependencies & Build React App
        run: |
          cd Front
          npm install
          npm run build

      - name: 🚀 Deploy Frontend (React Build) to swarna.hopeharbor.co.in
        uses: SamKirland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Front/dist/
          server-dir: ./swarna.hopeharbor.co.in/

      - name: 🚀 Deploy Backend (Node.js API) to swarnaback.hopeharbor.co.in
        uses: SamKirland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Back/
          server-dir: ./swarnaback.hopeharbor.co.in/
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.env
