<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>SwarnaIndia CMS · Add User</title>
  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- External stylesheet (existing) -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* additional minimal overrides to match government CMS UI */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f4f7fc;
      font-family: 'Outfit', sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* main container mimics dashboard width */
    .admin-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      background: transparent;
    }

    /* ----- HEADER (matches dashboard) ----- */
    .dashboard-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 0.9rem 2rem;
      border-radius: 24px;
      box-shadow: 0 8px 20px rgba(0, 20, 40, 0.04);
      margin-bottom: 2rem;
      border: 1px solid rgba(0, 40, 80, 0.04);
    }

    .brand {
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.3px;
      color: #0b2b4a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      background: #1a4b6d;
      color: white;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 2px 12px;
      border-radius: 40px;
      letter-spacing: 0.3px;
      margin-left: 6px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-outline-primary, .btn-outline-danger {
      background: transparent;
      border: 1px solid #cbd5e1;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1e3a5f;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: white;
    }

    .btn-outline-primary:hover {
      background: #eef4ff;
      border-color: #1a4b6d;
      color: #0b2b4a;
    }

    .btn-outline-danger {
      border-color: #f1d8da;
      color: #a13d44;
    }

    .btn-outline-danger:hover {
      background: #fff0f1;
      border-color: #c45a62;
      color: #7f2c33;
    }

    /* ----- BACK BUTTON (above form) ----- */
    .back-nav {
      margin-bottom: 1.25rem;
    }

    .back-nav button {
      background: white;
      border: 1px solid #dce3ec;
      padding: 0.5rem 1.5rem 0.5rem 1.2rem;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.95rem;
      color: #1f3a57;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .back-nav button:hover {
      background: #f8faff;
      border-color: #b0c5df;
      box-shadow: 0 4px 10px rgba(0, 40, 70, 0.04);
    }

    /* ----- CARD (centered) ----- */
    .form-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 2.5rem 2.8rem;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.12);
      border: 1px solid rgba(200, 215, 235, 0.25);
      max-width: 820px;
      margin: 0 auto;
      transition: 0.2s;
    }

    .form-card h2 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #0b2b4a;
      letter-spacing: -0.4px;
      margin-bottom: 0.2rem;
    }

    .form-card .subhead {
      color: #4a627a;
      font-weight: 400;
      font-size: 0.95rem;
      border-bottom: 2px solid #eef3f9;
      padding-bottom: 1.2rem;
      margin-bottom: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-card .subhead small {
      background: #eef6fd;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      color: #1a4b6d;
      font-weight: 500;
      font-size: 0.75rem;
    }

    /* ---- form grid (2 cols on desktop) ---- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem 1.8rem;
    }

    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-weight: 500;
      font-size: 0.85rem;
      color: #1f3a57;
      letter-spacing: -0.1px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .form-group label i {
      color: #8aa1bc;
      font-style: normal;
      font-size: 0.8rem;
    }

    .form-group input, 
    .form-group select {
      padding: 0.7rem 1rem;
      border: 1px solid #d9e2ef;
      border-radius: 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      background: #fbfdff;
      transition: 0.15s ease;
      color: #0b2b4a;
      width: 100%;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1a4b6d;
      box-shadow: 0 0 0 3px rgba(26, 75, 109, 0.08);
      background: white;
    }

    .form-group input::placeholder {
      color: #a6b9cf;
      font-weight: 300;
      font-size: 0.9rem;
    }

    /* error message */
    .error-msg {
      background: #fff5f5;
      color: #b13e44;
      padding: 0.7rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      border-left: 4px solid #c45a62;
      margin-top: 0.5rem;
      margin-bottom: 0.5rem;
      display: none;  /* will be shown by app.js */
    }

    .error-msg.show {
      display: block;
    }

    /* submit row */
    .form-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 1.2rem;
      margin-top: 2rem;
      border-top: 1px solid #e9eff6;
      padding-top: 2rem;
    }

    .btn-primary {
      background: #0b2b4a;
      border: none;
      padding: 0.8rem 2.8rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      box-shadow: 0 6px 14px rgba(11, 43, 74, 0.2);
      transition: 0.2s;
      cursor: pointer;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary:hover {
      background: #1a4b6d;
      box-shadow: 0 10px 20px -6px rgba(11, 43, 74, 0.35);
      transform: scale(1.01);
    }

    .btn-primary:active {
      background: #072236;
      transform: scale(0.98);
    }

    /* ===== responsive ===== */
    @media screen and (max-width: 768px) {
      body { padding: 1rem; }
      .dashboard-header {
        flex-direction: column;
        align-items: stretch;
        gap: 0.8rem;
        padding: 1.2rem 1.5rem;
      }
      .header-actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
      .form-card {
        padding: 1.8rem 1.2rem;
        border-radius: 28px;
      }
      .form-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .full-width {
        grid-column: span 1;
      }
      .form-card h2 {
        font-size: 1.6rem;
      }
      .form-actions {
        flex-direction: column-reverse;
        align-items: stretch;
      }
      .btn-primary {
        justify-content: center;
      }
      .back-nav button {
        width: 100%;
        justify-content: center;
      }
    }

    @media screen and (max-width: 480px) {
      .brand {
        font-size: 1.25rem;
      }
      .header-actions .btn-outline-primary,
      .header-actions .btn-outline-danger {
        padding: 0.4rem 1rem;
        font-size: 0.8rem;
      }
      .form-card {
        padding: 1.5rem 1rem;
      }
      .form-group input,
      .form-group select {
        padding: 0.6rem 0.9rem;
        font-size: 0.9rem;
      }
    }

    /* small extra polish */
    .text-muted {
      color: #5f7a97;
    }
    .fw-400 { font-weight: 400; }
    .gap-1 { gap: 0.5rem; }
    /* ===== DARK MODE OVERRIDES ===== */
    body.dark-theme, body.dark-mode {
      background: #0d1117 !important;
      color: #e6edf3 !important;
    }
    body.dark-theme .dashboard-header, body.dark-mode .dashboard-header,
    body.dark-theme .form-card, body.dark-mode .form-card {
      background: #1c2333 !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #e6edf3 !important;
    }
    body.dark-theme .brand, body.dark-mode .brand,
    body.dark-theme .form-card h2, body.dark-mode .form-card h2 {
      color: #f8fafc !important;
    }
    body.dark-theme .subhead, body.dark-mode .subhead {
      color: #94a3b8 !important;
      border-bottom-color: rgba(255, 255, 255, 0.1) !important;
    }
    body.dark-theme .subhead small, body.dark-mode .subhead small {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #ff9933 !important;
    }
    body.dark-theme .form-group label, body.dark-mode .form-group label {
      color: #cbd5e1 !important;
    }
    body.dark-theme .form-group input, body.dark-theme .form-group select,
    body.dark-mode .form-group input, body.dark-mode .form-group select {
      background: rgba(15, 23, 42, 0.6) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
      color: #f8fafc !important;
    }
    body.dark-theme .form-group input:focus, body.dark-theme .form-group select:focus,
    body.dark-mode .form-group input:focus, body.dark-mode .form-group select:focus {
      background: rgba(15, 23, 42, 0.9) !important;
      border-color: #ff9933 !important;
    }
    body.dark-theme .back-nav button, body.dark-mode .back-nav button,
    body.dark-theme .btn-outline-primary, body.dark-mode .btn-outline-primary {
      background: rgba(255, 255, 255, 0.08) !important;
      color: #e6edf3 !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
    }
    body.dark-theme .btn-primary, body.dark-mode .btn-primary {
      background: #ff9933 !important;
      color: #0d1117 !important;
    }
  </style>
</head>
<body>
<div class="admin-wrapper">

  <!-- HEADER (exactly as dashboard) -->
  <header class="dashboard-header">
    <div class="brand">
      SwarnaIndia CMS
      <span>v2</span>
    </div>
    <div class="header-actions">
      <button class="btn-outline-primary" onclick="window.location.href='dashboard.html'">
        <span>⬡</span> Back to Dashboard
      </button>
      <button class="btn-outline-danger" onclick="logout()">
        <span>⤬</span> Logout
      </button>
    </div>
  </header>

  <!-- Back button (above form) -->
  <div class="back-nav">
    <button onclick="window.location.href='dashboard.html'">
      ← Back to Dashboard
    </button>
  </div>

  <!-- Centered card -->
  <div class="form-card">
    <h2>Create New Account</h2>
    <div class="subhead">
      <span>User details · all fields required</span>
      <small>Gov. CMS</small>
    </div>

    <!-- Message Div (exactly as required) -->
    <div id="createError" class="error-msg"></div>

    <!-- FORM (IDs exactly as required) -->
    <form id="createUserForm" novalidate>
      <div class="form-grid">

        <!-- Account Role -->
        <div class="form-group full-width">
          <label for="targetRole">Account Role <i>(select)</i></label>
          <select id="targetRole" name="targetRole">
            <option value="Agency" selected>Agency</option>
            <option value="NGO">NGO</option>
            <option value="Member">Member</option>
            <option value="User">User</option>
          </select>
        </div>

        <!-- Full Name -->
        <div class="form-group full-width">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" placeholder="e.g. Aditya Kumar Sharma" autocomplete="name">
        </div>

        <!-- Profile Image / Logo -->
        <div class="form-group full-width">
          <label for="newProfileImage">Profile Image / Logo (Optional)</label>
          <input type="file" id="newProfileImage" accept="image/*">
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" placeholder="user@swarnaindia.gov.in" autocomplete="email">
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="newPhone">Phone Number</label>
          <input type="tel" id="newPhone" placeholder="+91 98765 43210" autocomplete="tel">
        </div>

        <!-- Date of Birth -->
        <div class="form-group">
          <label for="newDob">Date of Birth</label>
          <input type="date" id="newDob">
        </div>

        <!-- Address (full width) -->
        <div class="form-group full-width">
          <label for="newAddress">Address</label>
          <input type="text" id="newAddress" placeholder="Street, locality, landmark" autocomplete="address-line1">
        </div>

        <!-- City -->
        <div class="form-group">
          <label for="newCity">City</label>
          <input type="text" id="newCity" placeholder="New Delhi" autocomplete="address-level2">
        </div>

        <!-- State -->
        <div class="form-group">
          <label for="newState">State</label>
          <input type="text" id="newState" placeholder="Delhi" autocomplete="address-level1">
        </div>

        <!-- Pincode -->
        <div class="form-group">
          <label for="newPincode">Pincode</label>
          <input type="text" id="newPincode" placeholder="110001" inputmode="numeric">
        </div>

        <!-- Bank Name -->
        <div class="form-group">
          <label for="newBankName">Bank Name</label>
          <input type="text" id="newBankName" placeholder="State Bank of India">
        </div>

        <!-- Account Number -->
        <div class="form-group">
          <label for="newAccountNo">Account Number</label>
          <input type="text" id="newAccountNo" placeholder="123456789012" inputmode="numeric">
        </div>

        <!-- IFSC Code -->
        <div class="form-group">
          <label for="newIfscCode">IFSC Code</label>
          <input type="text" id="newIfscCode" placeholder="SBIN0001234" autocomplete="off">
        </div>

        <!-- UPI ID -->
        <div class="form-group">
          <label for="newUpiId">UPI ID</label>
          <input type="text" id="newUpiId" placeholder="user@upi" autocomplete="off">
        </div>

      </div><!-- end form-grid -->

      <!-- Submit + message area -->
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="createAccountBtn">
          <span>+</span> Create Account
        </button>
      </div>
    </form>
  </div>

  <!-- small footer note (optional) -->
  <div style="margin-top: 2.5rem; text-align: center; font-size: 0.8rem; color: #7d94b0; border-top: 1px solid #e2eaf3; padding-top: 1.5rem; letter-spacing: 0.2px;">
    SwarnaIndia · Government CMS · secured
  </div>
</div>

<!-- app.js (external, exactly as required) -->
<script src="js/app.js"></script>
</body>
</html>
