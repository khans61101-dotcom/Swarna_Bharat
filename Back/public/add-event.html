<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>SwarnaIndia CMS · Add Event</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f4f7fc; font-family: 'Outfit', sans-serif; padding: 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
    .admin-wrapper { max-width: 1280px; margin: 0 auto; width: 100%; }
    .dashboard-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #ffffff; padding: 0.9rem 2rem; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,20,40,0.04); margin-bottom: 2rem; border: 1px solid rgba(0,40,80,0.04); }
    .brand { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.3px; color: #0b2b4a; display: flex; align-items: center; gap: 8px; }
    .brand span { background: #1a4b6d; color: white; font-size: 0.7rem; font-weight: 500; padding: 2px 12px; border-radius: 40px; }
    .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    .btn-outline-primary, .btn-outline-danger { background: white; border: 1px solid #cbd5e1; padding: 0.5rem 1.2rem; border-radius: 60px; font-weight: 500; font-size: 0.9rem; color: #1e3a5f; transition: all 0.2s ease; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-outline-primary:hover { background: #eef4ff; border-color: #1a4b6d; color: #0b2b4a; }
    .btn-outline-danger { border-color: #f1d8da; color: #a13d44; }
    .btn-outline-danger:hover { background: #fff0f1; border-color: #c45a62; }
    .back-nav { margin-bottom: 1.25rem; }
    .back-nav button { background: white; border: 1px solid #dce3ec; padding: 0.5rem 1.5rem 0.5rem 1.2rem; border-radius: 60px; font-weight: 500; font-size: 0.95rem; color: #1f3a57; box-shadow: 0 2px 6px rgba(0,0,0,0.02); cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .back-nav button:hover { background: #f8faff; border-color: #b0c5df; }
    .form-card { background: #ffffff; border-radius: 32px; padding: 2.5rem 2.8rem; box-shadow: 0 20px 40px -12px rgba(0,20,40,0.12); border: 1px solid rgba(200,215,235,0.25); max-width: 820px; margin: 0 auto; }
    .form-card h2 { font-size: 1.9rem; font-weight: 600; color: #0b2b4a; margin-bottom: 0.2rem; }
    .form-card .subhead { color: #4a627a; font-weight: 400; font-size: 0.95rem; border-bottom: 2px solid #eef3f9; padding-bottom: 1.2rem; margin-bottom: 1.8rem; display: flex; align-items: center; justify-content: space-between; }
    .form-card .subhead small { background: #eef6fd; padding: 0.2rem 1rem; border-radius: 40px; color: #1a4b6d; font-weight: 500; font-size: 0.75rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem 1.8rem; }
    .full-width { grid-column: span 2; }
    .date-row { display: flex; gap: 8px; }
    .date-row .form-group { flex: 1; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-weight: 500; font-size: 0.85rem; color: #1f3a57; display: flex; align-items: center; gap: 4px; }
    .form-group input, .form-group select, .form-group textarea { padding: 0.7rem 1rem; border: 1px solid #d9e2ef; border-radius: 18px; font-family: 'Outfit', sans-serif; font-size: 0.95rem; background: #fbfdff; transition: 0.15s ease; color: #0b2b4a; width: 100%; outline: none; }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #1a4b6d; box-shadow: 0 0 0 3px rgba(26,75,109,0.08); background: white; }
    .error-msg { background: #fff5f5; color: #b13e44; padding: 0.7rem 1.2rem; border-radius: 40px; font-size: 0.9rem; border-left: 4px solid #c45a62; margin-bottom: 1rem; display: none; }
    .error-msg:not(:empty) { display: block; }
    .form-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 1.2rem; margin-top: 2rem; border-top: 1px solid #e9eff6; padding-top: 2rem; }
    .btn-primary { background: #0b2b4a; border: none; padding: 0.8rem 2.8rem; border-radius: 60px; font-weight: 600; font-size: 1rem; color: white; box-shadow: 0 6px 14px rgba(11,43,74,0.2); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    .btn-primary:hover { background: #1a4b6d; box-shadow: 0 10px 20px -6px rgba(11,43,74,0.35); transform: scale(1.01); }
    .footer-note { margin-top: 2.5rem; text-align: center; font-size: 0.8rem; color: #7d94b0; border-top: 1px solid #e2eaf3; padding-top: 1.5rem; }
    @media screen and (max-width: 768px) {
      body { padding: 1rem; }
      .form-card { padding: 1.8rem 1.2rem; border-radius: 28px; }
      .form-grid { grid-template-columns: 1fr; gap: 1rem; }
      .full-width { grid-column: span 1; }
      .date-row { flex-direction: column; }
      .form-card h2 { font-size: 1.6rem; }
      .form-actions { flex-direction: column-reverse; align-items: stretch; }
      .btn-primary { justify-content: center; }
    }
    /* DARK MODE */
    body.dark-theme, body.dark-mode { background: #0d1117 !important; color: #e6edf3 !important; }
    body.dark-theme .dashboard-header, body.dark-mode .dashboard-header,
    body.dark-theme .form-card, body.dark-mode .form-card { background: #1c2333 !important; border-color: rgba(255,255,255,0.1) !important; }
    body.dark-theme .brand, body.dark-mode .brand,
    body.dark-theme .form-card h2, body.dark-mode .form-card h2 { color: #f8fafc !important; }
    body.dark-theme .subhead, body.dark-mode .subhead { color: #94a3b8 !important; border-bottom-color: rgba(255,255,255,0.1) !important; }
    body.dark-theme .subhead small, body.dark-mode .subhead small { background: rgba(255,255,255,0.08) !important; color: #ff9933 !important; }
    body.dark-theme .form-group label, body.dark-mode .form-group label { color: #cbd5e1 !important; }
    body.dark-theme .form-group input, body.dark-theme .form-group select, body.dark-theme .form-group textarea,
    body.dark-mode .form-group input, body.dark-mode .form-group select, body.dark-mode .form-group textarea { background: rgba(15,23,42,0.6) !important; border-color: rgba(255,255,255,0.15) !important; color: #f8fafc !important; }
    body.dark-theme .form-group input:focus, body.dark-theme .form-group select:focus, body.dark-theme .form-group textarea:focus,
    body.dark-mode .form-group input:focus, body.dark-mode .form-group select:focus, body.dark-mode .form-group textarea:focus { background: rgba(15,23,42,0.9) !important; border-color: #ff9933 !important; }
    body.dark-theme .back-nav button, body.dark-mode .back-nav button,
    body.dark-theme .btn-outline-primary, body.dark-mode .btn-outline-primary { background: rgba(255,255,255,0.08) !important; color: #e6edf3 !important; border-color: rgba(255,255,255,0.15) !important; }
    body.dark-theme .btn-outline-danger, body.dark-mode .btn-outline-danger { background: rgba(255,255,255,0.05) !important; color: #f87171 !important; border-color: rgba(248,113,113,0.3) !important; }
    body.dark-theme .btn-primary, body.dark-mode .btn-primary { background: #ff9933 !important; color: #0d1117 !important; }
    body.dark-theme .form-actions, body.dark-mode .form-actions { border-top-color: rgba(255,255,255,0.1) !important; }
    body.dark-theme .footer-note, body.dark-mode .footer-note { color: #4b5a6b !important; border-top-color: rgba(255,255,255,0.07) !important; }
  </style>
</head>
<body>
<div class="admin-wrapper">
  <header class="dashboard-header">
    <div class="brand">SwarnaIndia CMS <span>v2</span></div>
    <div class="header-actions">
      <button class="btn-outline-primary" onclick="window.location.href='dashboard.html'">⬡ Back to Dashboard</button>
      <button class="btn-outline-danger" onclick="logout()">⊬ Logout</button>
    </div>
  </header>

  <div class="back-nav">
    <button onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
  </div>

  <div class="form-card">
    <h2>📅 Create New Event</h2>
    <div class="subhead">
      <span>Event details · bilingual content</span>
      <small>Gov. CMS</small>
    </div>
    <div id="eventError" class="error-msg"></div>
    <form id="createEventForm" novalidate>
      <div class="form-grid">
        <div class="full-width">
          <div class="date-row">
            <div class="form-group">
              <label>📅 Day</label>
              <input type="text" id="eventDay" placeholder="15">
            </div>
            <div class="form-group">
              <label>📅 Month</label>
              <input type="text" id="eventMonth" placeholder="AUG">
            </div>
            <div class="form-group">
              <label>📅 Year</label>
              <input type="text" id="eventYear" placeholder="2026">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label>📝 Title (EN)</label>
          <input type="text" id="eventTitle" required placeholder="Event title in English">
        </div>
        <div class="form-group">
          <label>📝 Title (HI)</label>
          <input type="text" id="eventTitleHi" placeholder="हिंदी में शीर्षक">
        </div>
        <div class="form-group">
          <label>📍 Location (EN)</label>
          <input type="text" id="eventLocation" placeholder="Venue, City">
        </div>
        <div class="form-group">
          <label>📍 Location (HI)</label>
          <input type="text" id="eventLocationHi" placeholder="स्थान (हिंदी)">
        </div>
        <div class="form-group">
          <label>🏷 Category (EN)</label>
          <select id="eventCategory">
            <option value="National Conclave">National Conclave</option>
            <option value="Global Summit">Global Summit</option>
            <option value="Youth Forum">Youth Forum</option>
            <option value="National Address">National Address</option>
            <option value="Cultural &amp; Wellness">Cultural &amp; Wellness</option>
          </select>
        </div>
        <div class="form-group">
          <label>🏷 Category (HI)</label>
          <input type="text" id="eventCategoryHi" placeholder="Optional Hindi category">
        </div>
        <div class="form-group full-width">
          <label>📄 Description (EN)</label>
          <textarea id="eventDesc" placeholder="Event description..."></textarea>
        </div>
        <div class="form-group full-width">
          <label>📄 Description (HI)</label>
          <textarea id="eventDescHi" placeholder="कार्यक्रम विवरण..."></textarea>
        </div>
        <div class="form-group full-width">
          <label>🖼 Main Cover Image (List View)</label>
          <input type="file" id="eventImage" accept="image/*">
        </div>
        <div class="form-group full-width">
          <label>📸 Multiple Gallery Images (Event Details View)</label>
          <input type="file" id="eventGallery" accept="image/*" multiple>
          <small style="color:#64748B;margin-top:4px;display:block;">Select multiple photos to display in the Event Details gallery grid.</small>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">📅 Create Event</button>
      </div>
    </form>
  </div>

  <div class="footer-note">SwarnaIndia · Government CMS · secured</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
